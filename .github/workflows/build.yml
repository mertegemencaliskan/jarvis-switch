name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: scripts/build.sh
      - name: Smoke test
        run: |
          APP=build/JarvisSwitch.app/Contents/MacOS/JarvisSwitch
          test "$($APP --version)" = "$(tr -d '[:space:]' < VERSION)"
          $APP --status
          $APP --status --json | python3 -m json.tool > /dev/null
          doctor="$($APP --doctor --json || true)"
          echo "$doctor" | python3 -m json.tool > /dev/null
          python3 -m json.tool config.schema.json > /dev/null
          python3 -m json.tool examples/config.example.json > /dev/null
